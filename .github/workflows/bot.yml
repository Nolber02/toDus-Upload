name: Ejecutar Bot ToDus

on:
  #schedule:
    # Se ejecuta cada 5 horas y 45 minutos para evitar cortes
    #- cron: '45 */5 * * *'
  workflow_dispatch:

# Esto asegura que si hay dos ejecuciones a la vez, GitHub cancele la vieja y deje la nueva
concurrency:
  group: todus-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r TODUS/requirements.txt

      - name: Iniciar el Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          cd TODUS
          python bot.py