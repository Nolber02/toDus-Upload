[TELEGRAM]
fuente =
detectar_reenvios = true
procesar_automatico = true
max_videos_dia = 1000
subir_mp4_telegram = true
canal_mp4 =

[STREAM]
compression_profile = small
calidades = 360p, 480p
guardar_en_todus = true
server_port = 24716
ffmpeg_threads = 0

[TODUS]
namespace_prefix = telegram
max_file_size_mb = 2048

# ─── HOST ACTIVO ───
#   stickers → https://stickers.todus.cu  (raíz = bucket "stickers")
#   stream   → https://s3.todus.cu/stream (raíz = bucket "stream")
# El comando /host permite cambiarlo en caliente.
default_host = stickers

# ─── ENDPOINTS ───
stickers_base_url = https://stickers.todus.cu
stream_base_url   = https://s3.todus.cu/stream

# ─── RUTA BASE DENTRO DEL BUCKET ───
# Aquí se guardan TODOS los HLS del bot, bajo:
#     {hls_prefix}/<video>/master.m3u8
#     {hls_prefix}/<video>/<video>_<calidad>/playlist.m3u8
#     {hls_prefix}/<video>/<video>_<calidad>/segmentNNN.ts
#
# Ejemplos:
#   public/hls                 → https://stickers.todus.cu/public/hls/<video>/...
#   public/hls/telegram        → https://stickers.todus.cu/public/hls/telegram/<video>/...
#   hi/1062249884/hls          → https://s3.todus.cu/stream/hi/1062249884/hls/<video>/...
#   telegram                   → https://s3.todus.cu/stream/telegram/<video>/...
#
# Puedes usar {admin_id} y se expandirá al owner_id.
hls_prefix = nc/hls