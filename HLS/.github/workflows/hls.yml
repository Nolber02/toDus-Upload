name: Ejecutar HLS con FlareGUI

on:
  #schedule:
    # Se ejecuta cada 5 horas y 30 minutos
    #- cron: '30 */9 * * *'
  workflow_dispatch:

concurrency:
  group: hls-bot
  cancel-in-progress: true

jobs:
  run-hls:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configurar Node.js (Necesario para npx)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r HLS/requirements.txt

      - name: Iniciar el Bot HLS
        env:
          HLS_API_ID: ${{ secrets.HLS_API_ID }}
          HLS_API_HASH: ${{ secrets.HLS_API_HASH }}
          HLS_BOT_TOKEN: ${{ secrets.HLS_BOT_TOKEN }}
          HLS_OWNER_ID: ${{ secrets.HLS_OWNER_ID }}
        run: |
          cd HLS
          python -u main.py