[Bot]
bot_name = ToDus S3 Cloud
daily_quota_mb = 1024
max_file_size_mb = 2048
simulated_upload_time = 2.5
temp_dir = TODUS/temp_downloads

# ─── Auto-recuperación ───
auto_recovery_enabled = true
auto_recovery_interval_minutes = 60

[ToDus]
namespace_prefix = nc

# ─── RUTA BASE DEL BOT (configurable) ───
# Aquí se guardarán TODOS los archivos del bot, bajo:
#     {root_prefix}/tg_{user_id}/{archivo}
#
# Ejemplos:
#   public/todus              → public/todus/tg_1234/video.mp4
#   hi/1062249884             → hi/1062249884/tg_1234/video.mp4
#   hi/1062249884/misubidas   → hi/1062249884/misubidas/tg_1234/video.mp4
#
# Puedes usar {admin_id} y se expandirá al ID del admin principal.
root_prefix = nc/1062249884

# ─── URLs DE LOS ENDPOINTS S3 ───
# El comando /host alterna entre estos dos.
stickers_base_url = https://stickers.todus.cu
stream_base_url   = https://s3.todus.cu/stream

# Host por defecto al arrancar (stream | stickers)
default_host = stickers
